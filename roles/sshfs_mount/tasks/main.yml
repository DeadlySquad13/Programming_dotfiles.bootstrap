---
- name: Ensure systemd user directory exists
  ansible.builtin.file:
    path: "{{ sshfs_systemd_user_dir }}"
    state: directory
    mode: '0755'

- name: Ensure local mount point exists
  ansible.builtin.file:
    path: "{{ sshfs_local_path }}"
    state: directory
    mode: '0755'

# Otherwise would throw an error 'Systemd Mount Where= Setting Doesn't Match Unit Name'.
# [Source][@/Don_crissti/AnswerSystemdMount.2017]|[Zotero][z@/Don_crissti/AnswerSystemdMount.2017]
- name: Generate systemd-escaped mount unit name
  ansible.builtin.command:
    cmd: "systemd-escape -p --suffix=service {{ sshfs_local_path | quote }}"
  register: sshfs_service_unit_name
  changed_when: false
  check_mode: false

- name: Set service unit filename
  ansible.builtin.set_fact:
    sshfs_service_unit_file: "{{ sshfs_service_unit_name.stdout }}"

- name: Debug service unit name
  ansible.builtin.debug:
    msg: "Service unit will be named: {{ sshfs_service_unit_file }}"
    verbosity: 1

- name: Inject SSH_AUTH_SOCK into service environment
  ansible.builtin.set_fact:
    sshfs_env: "{{ sshfs_env | combine({'SSH_AUTH_SOCK': ansible_env.SSH_AUTH_SOCK}) }}"
  when: ansible_env.SSH_AUTH_SOCK is defined

- name: Combine options with extras
  ansible.builtin.set_fact:
    _sshfs_combined_options: "{{ sshfs_options + sshfs_extra_options }}"

- name: Generate systemd service unit file
  ansible.builtin.template:
    src: "{{ sshfs_template_src }}"
    dest: "{{ sshfs_systemd_user_dir }}/{{ sshfs_service_unit_file }}"
    mode: '0644'

- name: Reload systemd user daemon
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"

- name: Enable and start SSHFS mount service
  ansible.builtin.systemd:
    name: "{{ sshfs_service_unit_file }}"
    enabled: true
    state: started
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
  register: sshfs_mount_result
  ignore_errors: true

- name: Show mount status on failure
  ansible.builtin.debug:
    msg: >
      SSHFS mount service failed to start.
      Check 'journalctl --user -u {{ sshfs_service_unit_file }}'
      and verify SSH access to {{ sshfs_remote_user }}@{{ sshfs_remote_host }}.
  when: sshfs_mount_result.failed | default(false)

# References:
# [@/Don_crissti/AnswerSystemdMount.2017]: <https://unix.stackexchange.com/a/345518> 'Answer to "Systemd Mount Fails. Where= Setting Doesn't Match Unit Name"'
